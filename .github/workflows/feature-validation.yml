name: Feature validation

on:
  push:
    branches:
      - feature/detailed-power-vector-plots

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run repository acceptance
        run: bash tools/ari-emonio-acceptance.sh
      - name: Remove temporary workflow from candidate tree
        run: rm .github/workflows/feature-validation.yml
      - name: Run publication gate
        run: python tools/publication_gate.py --working-tree
      - name: Build deterministic candidate
        run: python tools/build-release.py
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: ARI_Emonio_Viewer_v0.4.4_Candidate
          path: |
            dist/ARI_Emonio_Viewer_v0.4.4_Candidate.zip
            dist/ARI_Emonio_Viewer_v0.4.4_Candidate.zip.sha256
          if-no-files-found: error
          retention-days: 7

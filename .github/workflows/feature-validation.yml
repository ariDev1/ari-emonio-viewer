name: Feature validation

on:
  push:
    branches:
      - feature/detailed-power-vector-plots

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused vector refinement tests
        run: pytest -q tests/browser/test_quadrant_visual_refinement.py tests/browser/test_quadrant_plot_model.py tests/browser/test_quadrant_detail_contract.py

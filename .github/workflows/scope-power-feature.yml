name: Scope Power Feature Validation

on:
  push:
    branches:
      - feature/scope-derived-power

jobs:
  feature-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Scope power feature tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. pytest -q tests/browser/test_scope_power_feature.py 2>&1 | tee scope-power-test.log
      - name: Preserve Scope power test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-power-test-evidence
          path: scope-power-test.log

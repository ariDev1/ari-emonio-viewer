name: Scope Power Feature Validation

on:
  push:
    branches:
      - feature/scope-derived-power

jobs:
  feature-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete acceptance suite
        shell: bash
        run: |
          set -o pipefail
          ./tools/ari-emonio-acceptance.sh 2>&1 | tee ari-emonio-acceptance.log
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ari-emonio-acceptance-evidence
          path: ari-emonio-acceptance.log

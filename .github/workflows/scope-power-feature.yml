name: Scope Power Feature Validation

on:
  push:
    branches:
      - feature/scope-derived-power

jobs:
  feature-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete acceptance suite
        shell: bash
        run: |
          set -o pipefail
          ./tools/ari-emonio-acceptance.sh 2>&1 | tee ari-emonio-acceptance.log
      - name: Run publication gate on feature changes
        shell: bash
        run: |
          set -o pipefail
          git reset --mixed origin/main
          git add -A
          ./tools/ari-emonio-publication-gate.sh 2>&1 | tee ari-emonio-publication.log
      - name: Build deterministic v0.4.6 Candidate
        shell: bash
        run: |
          set -o pipefail
          rm -f .github/workflows/scope-power-feature.yml
          python3 tools/build-release.py 2>&1 | tee ari-emonio-build.log
          test -f dist/ARI_Emonio_Viewer_v0.4.6_Candidate.zip
          test -f dist/ARI_Emonio_Viewer_v0.4.6_Candidate.zip.sha256
          ! unzip -Z1 dist/ARI_Emonio_Viewer_v0.4.6_Candidate.zip | grep -q 'scope-power-feature.yml'
      - name: Preserve final candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ari-emonio-v0.4.6-candidate
          path: |
            ari-emonio-acceptance.log
            ari-emonio-publication.log
            ari-emonio-build.log
            dist/ARI_Emonio_Viewer_v0.4.6_Candidate.zip
            dist/ARI_Emonio_Viewer_v0.4.6_Candidate.zip.sha256

name: Apply Verified Browser Test Harness Corrections

on:
  push:
    branches:
      - testing

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply verified browser test harness corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic test-only corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          history = Path('tests/browser/test_history_math.py')
          text = history.read_text(encoding='utf-8')
          old = 'classList: { toggle() {} },'
          count = text.count(old)
          if count < 1:
              raise SystemExit('expected fake classList pattern not found')
          text = text.replace(old, 'classList: { toggle() {}, remove() {} },')
          history.write_text(text, encoding='utf-8')
          print(f'updated {count} fake classList definition(s)')

          for name in (
              'tests/browser/test_frontend_contract.py',
              'tests/browser/test_device_lifecycle_contract.py',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              marker = '        "modbus-evidence.css",\n'
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{name}: expected one CSS-set marker, found {count}')
              replacement = marker + '        "density.css",\n        "recording-monitor.css",\n'
              path.write_text(text.replace(marker, replacement), encoding='utf-8')

          Path('.github/workflows/history-debug.yml').unlink(missing_ok=False)
          Path('.github/workflows/apply-test-harness-fix.yml').unlink(missing_ok=False)
          PY

          git diff --check
          git diff -- tests/browser/test_history_math.py tests/browser/test_frontend_contract.py tests/browser/test_device_lifecycle_contract.py .github/workflows/history-debug.yml .github/workflows/apply-test-harness-fix.yml

      - name: Commit test-only corrections
        run: |
          git config user.name 'ARI Acceptance Bot'
          git config user.email 'mail@aether-research.institute'
          git add tests/browser/test_history_math.py \
                  tests/browser/test_frontend_contract.py \
                  tests/browser/test_device_lifecycle_contract.py \
                  .github/workflows/history-debug.yml \
                  .github/workflows/apply-test-harness-fix.yml
          git commit -m 'test: correct v0.4.16 browser harness expectations'
          git push origin HEAD:testing
